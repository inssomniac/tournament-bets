server {
    listen 80;
    server_name insomniac.tournament-dvfu.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name insomniac.tournament-dvfu.ru;

    ssl_certificate     /etc/letsencrypt/live/insomniac.tournament-dvfu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insomniac.tournament-dvfu.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Frontend — статика
    root /var/www/tournament/frontend;
    index index.html;

    # SPA: все маршруты → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
