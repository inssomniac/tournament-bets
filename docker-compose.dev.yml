services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "6432:5432"
    environment:
      POSTGRES_DB: tournament
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tournament"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
